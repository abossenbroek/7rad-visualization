# yamllint disable-line rule:line-length
# yaml-language-server: $schema=https://json.schemastore.org/pre-commit-config.json
---
default_stages: [pre-commit, pre-push]

repos:
    - repo: "https://github.com/pre-commit/pre-commit-hooks"
      rev: v6.0.0
      hooks:
          - id: check-added-large-files
            args: ["--maxkb=2500"]
          - id: check-merge-conflict
          - id: end-of-file-fixer
          - id: trailing-whitespace
            exclude: '.*\.md$'
          - id: check-toml
          - id: check-yaml


    - repo: "https://github.com/astral-sh/ruff-pre-commit"
      rev: v0.12.11
      hooks:
          - id: ruff
            args:
                - "--fix"
          - id: ruff-format

    - repo: https://github.com/RobertCraigie/pyright-python
      rev: v1.1.404
      hooks:
        - id: pyright

    - repo: https://github.com/rhysd/actionlint
      rev: v1.7.7
      hooks:
          - id: actionlint
            name: Validate GitHub Actions workflows
            description: Validate GitHub Actions workflow files
            files: ^\.github/workflows/.*\.(ya?ml)$  # Only run on yaml files in .github/workflows

    - repo: https://github.com/mrtazz/checkmake
      rev: 0.2.2
      hooks:
        - id: checkmake
          name: Validate Makefiles with checkmake
          files: (?i)^backend/.*(makefile|Makefile)$
          exclude: ^vendor/
          # Use our config file to disable maxbodylength rule
          args: ["--config=.checkmake.ini"]
